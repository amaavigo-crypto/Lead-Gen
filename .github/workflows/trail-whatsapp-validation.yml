name: Trail build and type validation

on:
  push:
    branches:
      - Trail
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Trail
        uses: actions/checkout@v4
        with:
          ref: Trail
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
