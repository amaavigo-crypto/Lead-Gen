name: Social Studio branch build

on:
  push:
    branches:
      - feature/social-studio-postiz-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-build:
    name: Production bundle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application and API bundles
        run: npm run build
