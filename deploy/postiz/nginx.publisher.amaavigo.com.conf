# Install as /etc/nginx/sites-available/publisher.amaavigo.com
# Obtain TLS certificates with certbot after the DNS A record points to this VPS.

server {
    listen 80;
    listen [::]:80;
    server_name publisher.amaavigo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name publisher.amaavigo.com;

    ssl_certificate /etc/letsencrypt/live/publisher.amaavigo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publisher.amaavigo.com/privkey.pem;

    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:4007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
